<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Team3System</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="styles/base.css">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: #1a1a1a;
            border-radius: 16px;
            box-shadow: 0 20px 60px -15px rgba(0, 0, 0, 0.7);
            padding: 48px;
            border: 1px solid #333;
        }

        .login-header {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #000000;
            border-radius: 12px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 2px solid #333;
        }

        .logo .material-icons {
            font-size: 48px;
            color: #F19E39;
        }

        .login-header h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            color: #cccccc;
            font-size: 14px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            background: #2563eb;
        }

        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="material-icons">inventory_2</span>
                </div>
                <h1>Team3System</h1>
                <p>Sistema de Gestión de Inventario</p>
            </div>

            <div id="alertContainer"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="login">Usuario</label>
                    <input type="text" id="login" name="login" required autocomplete="username"
                        placeholder="Ingrese su usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        placeholder="Ingrese su contraseña">
                </div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span id="loginText">Iniciar Sesión</span>
                    <span id="loginLoading" class="loading-spinner" style="display: none;"></span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://backend.tpdteam3.com/backend/api';

        // Reset visual
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('loginForm').reset();
        });

        // Redirección si ya está logueado → al SPA
        if (sessionStorage.getItem('token')) {
            window.location.href = 'app.html#dashboard';
        }

        // Manejo del login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;

            const btn = document.getElementById('btnLogin');
            const txt = document.getElementById('loginText');
            const spinner = document.getElementById('loginLoading');

            if (!login || !password) {
                showAlert('Por favor complete todos los campos', 'error');
                return;
            }

            btn.disabled = true;
            txt.textContent = 'Iniciando sesión...';
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                const data = await response.json();

                if (response.ok && data.resultado === 'Ok') {
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('username', login);

                    showAlert('¡Bienvenido! Redirigiendo...', 'success');
                    document.getElementById('loginForm').reset();

                    setTimeout(() => {
                        window.location.href = 'app.html#dashboard';
                    }, 800);

                } else {
                    showAlert(data.mensaje || 'Credenciales incorrectas', 'error');
                    btn.disabled = false;
                    txt.textContent = 'Iniciar Sesión';
                    spinner.style.display = 'none';
                }

            } catch (error) {
                showAlert('Error de conexión. Verifique el servidor.', 'error');
                btn.disabled = false;
                txt.textContent = 'Iniciar Sesión';
                spinner.style.display = 'none';
            }
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                document.getElementById('loginForm').reset();
            }
        });

        // Alertas
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.getElementById('alertContainer').appendChild(alert);

            setTimeout(() => alert.remove(), 4000);
        }
    </script>
</body>
</html>
