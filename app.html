<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Team3System — App</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
        <!-- Ícono/logo que desaparece al colapsar -->
        <span class="material-icons sidebar-logo" id="sidebarLogo">inventory_2</span>

        <!-- Nombre del sistema -->
        <span class="sidebar-brand">Team3System</span>

        <!-- Botón interno para colapsar / expandir -->
        <button class="sidebar-collapse-btn" id="sidebarToggle">
            <span class="material-icons" id="sidebarToggleIcon">left_panel_close</span>
        </button>
</div>

      <div class="sidebar-menu" id="sidebarMenu">
        <a href="#dashboard" class="nav-item" data-view="dashboard" data-tooltip="Dashboard">
          <span class="material-icons">dashboard</span><span>Dashboard</span>
        </a>
        <a href="#producto" class="nav-item" data-view="producto" data-tooltip="Productos">
          <span class="material-icons">inventory</span><span>Productos</span>
        </a>
        <a href="#cliente" class="nav-item" data-view="cliente" data-tooltip="Clientes">
          <span class="material-icons">people</span><span>Clientes</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="userAvatar">U</div>
          <div class="user-details">
            <div class="user-label">Usuario activo</div>
            <div class="user-name" id="userName">Cargando...</div>
          </div>
        </div>

        <button class="btn-logout" id="btnLogout">
          <span class="material-icons">logout</span><span>Cerrar Sesión</span>
        </button>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
      <main id="view" class="container" tabindex="-1"></main>
    </div>

    <script type="module" src="scripts/app.js"></script>
  </body>
</html>
