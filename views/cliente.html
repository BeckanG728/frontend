<!-- ============================================
     CLIENTES VIEW
     Gestión de clientes
============================================ -->

<!-- Encabezado de página -->
<div class="page-header">
  <h1>
    <span class="material-icons" aria-hidden="true">people</span>
    Clientes
  </h1>
  <button class="btn-primary" id="btnNewClient" aria-label="Crear nuevo cliente">
    <span class="material-icons" aria-hidden="true">add</span>
    Nuevo Cliente
  </button>
</div>

<!-- Contenedor de alertas -->
<div id="alertContainer" role="alert" aria-live="polite"></div>

<!-- Barra de búsqueda -->
<div class="search-bar">
  <input 
    type="text" 
    id="searchInput" 
    placeholder="🔍 Buscar clientes por nombre o ID..." 
    aria-label="Buscar clientes"
    autocomplete="off"
  />
</div>

<!-- Tabla de clientes -->
<section class="table-container" aria-label="Lista de clientes">
  <table id="clientesTable">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nombre del Cliente</th>
        <th scope="col">Acciones</th>
      </tr>
    </thead>
    <tbody id="clientesBody">
      <tr>
        <td colspan="3" class="loading">Cargando clientes...</td>
      </tr>
    </tbody>
  </table>
</section>

<!-- ============================================
     MODAL: CLIENTE (Crear/Editar)
============================================ -->
<div id="clienteModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-content">
    <!-- Header del modal -->
    <div class="modal-header">
      <h2 id="modalTitle">
        <span class="material-icons" id="modalIcon" aria-hidden="true">person_add</span>
        <span id="modalTitleText">Nuevo Cliente</span>
      </h2>
      <button class="btn-close" id="clienteModalClose" aria-label="Cerrar modal">&times;</button>
    </div>

    <!-- Formulario -->
    <form id="clienteForm" novalidate>
      <input type="hidden" id="clienteId" />

      <!-- Campo: Nombre -->
      <div class="form-group">
        <label for="clienteName">
          Nombre del Cliente <span style="color: #dc2626;">*</span>
        </label>
        <input 
          type="text" 
          id="clienteName" 
          name="clienteName"
          required 
          placeholder="Ingrese el nombre completo"
          autocomplete="off"
          maxlength="100"
        />
        <small style="color: #999; display: block; margin-top: 8px;">
          Nombre completo del cliente o razón social
        </small>
      </div>

      <!-- Acciones del formulario -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="clienteFormCancel">
          Cancelar
        </button>
        <button type="submit" class="btn-save">
          <span class="material-icons" aria-hidden="true">save</span>
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
