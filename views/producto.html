<!-- views/producto.html - contenido puro -->
<div class="page-header">
  <h1><span class="material-icons">inventory</span>Productos</h1>
  <button class="btn-primary" id="btnNewProduct">
    <span class="material-icons">add</span>Nuevo Producto
  </button>
</div>

<div id="alertContainer"></div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 Buscar productos..." aria-label="Buscar productos">
</div>

<div id="productsContainer" class="products-grid">
  <div class="loading">Cargando productos...</div>
</div>

<!-- Product Modal (markup included as fragment so product.js can hook to it) -->
<div id="productModal" class="modal" aria-hidden="true">
  <div class="modal-content">
    <div class="modal-header">
      <h2><span class="material-icons" id="modalIcon">add_box</span><span id="modalTitle">Nuevo Producto</span></h2>
      <button class="btn-close" id="productModalClose">&times;</button>
    </div>
    <form id="productForm">
      <input type="hidden" id="productId">
      <input type="hidden" id="productVersion">
      <div class="form-group">
        <label>Nombre del Producto *</label>
        <input type="text" id="productName" required placeholder="Ej: Laptop HP 15">
      </div>
      <div class="form-group">
        <label>Precio (S/) *</label>
        <input type="number" id="productPrice" step="0.01" min="0" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Stock *</label>
        <input type="number" id="productStock" step="1" min="0" required placeholder="0">
      </div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="productFormCancel">Cancelar</button>
        <button type="submit" class="btn-save"><span class="material-icons">save</span>Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Image Modal -->
<div id="imageModal" class="modal" aria-hidden="true">
  <div class="modal-content">
    <div class="modal-header">
      <h2><span class="material-icons">image</span>Subir Imagen</h2>
      <button class="btn-close" id="imageModalClose">&times;</button>
    </div>
    <form id="imageForm">
      <div class="form-group">
        <label>Seleccionar Imagen</label>
        <input type="file" id="imageFile" accept="image/*" required>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-cancel" id="imageFormCancel">Cancelar</button>
        <button type="submit" class="btn-save"><span class="material-icons">upload</span>Subir Imagen</button>
      </div>
    </form>
  </div>
</div>
